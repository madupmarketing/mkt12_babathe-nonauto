name: Daily Media Crawl (바바더닷컴)

on:
  # 매일 KST 07:40 (= 22:40 UTC 전날)
  # 이전: "0 23 * * *" (KST 08:00, 정각) → 전 세계 크론이 정각에 몰려 지연·누락 발생
  # 변경: 분(minute)을 정각에서 비켜 비혼잡 시간대로 이동해 예약 지연 확률을 낮춤
  schedule:
    - cron: "40 22 * * *"
  # 수동 실행 및 날짜 지정 재실행
  workflow_dispatch:
    inputs:
      target_date:
        description: "단일 날짜 (YYYY-MM-DD) — 비워두면 전일자 자동 적용"
        required: false
        default: ""
      date_from:
        description: "기간 시작 날짜 (YYYY-MM-DD)"
        required: false
        default: ""
      date_to:
        description: "기간 종료 날짜 (YYYY-MM-DD)"
        required: false
        default: ""

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Chrome 설치
        uses: browser-actions/setup-chrome@v1

      - name: Chrome 버전 확인
        run: google-chrome --version

      - name: 크롤링 및 Sheets 업로드 실행
        env:
          TARGET_DATE:            ${{ github.event.inputs.target_date }}
          DATE_FROM:              ${{ github.event.inputs.date_from }}
          DATE_TO:                ${{ github.event.inputs.date_to }}
          ALLOW_PARTIAL_UPLOAD:   "1"
          SKIP_CRAWLERS:          ""
          BUZZVIL_EMAIL:          ${{ secrets.BUZZVIL_EMAIL }}
          BUZZVIL_PASSWORD:       ${{ secrets.BUZZVIL_PASSWORD }}
          ISCREEN_ID:             ${{ secrets.ISCREEN_ID }}
          ISCREEN_PW:             ${{ secrets.ISCREEN_PW }}
          NAVER_ID:               ${{ secrets.NAVER_ID }}
          NAVER_PW:               ${{ secrets.NAVER_PW }}
          NAVER_COOKIE:           ${{ secrets.NAVER_COOKIE }}
          EDIAI_ID:               ${{ secrets.EDIAI_ID }}
          EDIAI_PW:               ${{ secrets.EDIAI_PW }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python main.py

      - name: 디버그 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_id }}
          path: /tmp/*.png
          if-no-files-found: ignore

      - name: Slack 알림 전송
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GAS_RERUN_URL:     ${{ vars.GAS_RERUN_URL }}
          JOB_STATUS:        ${{ job.status }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 알림 건너뜀"
            exit 0
          fi
          export REPORT_DATE=$(TZ=Asia/Seoul date -d 'yesterday' '+%Y-%m-%d' 2>/dev/null || TZ=Asia/Seoul date -v-1d '+%Y-%m-%d')
          python3 <<'PYEOF'
          import os, json, urllib.request

          status  = os.environ.get('JOB_STATUS', 'failure')
          target  = os.environ.get('REPORT_DATE', '')
          gas_url = os.environ.get('GAS_RERUN_URL', '')
          wh_url  = os.environ.get('SLACK_WEBHOOK_URL', '')

          icon        = ':white_check_mark:' if status == 'success' else ':x:'
          status_text = '업로드 성공' if status == 'success' else '업로드 실패'

          blocks = [{
              'type': 'section',
              'text': {
                  'type': 'mrkdwn',
                  'text': f'{icon} *[바바더닷컴 수기매체]* {status_text}\n대상 날짜: `{target}`'
              }
          }]
          if gas_url:
              blocks.append({
                  'type': 'actions',
                  'elements': [{
                      'type': 'button',
                      'text': {'type': 'plain_text', 'text': '📅 재수집하기', 'emoji': True},
                      'url': gas_url,
                      'style': 'primary'
                  }]
              })

          body = json.dumps({'blocks': blocks}).encode()
          req  = urllib.request.Request(
              wh_url, data=body,
              headers={'Content-Type': 'application/json'},
              method='POST'
          )
          urllib.request.urlopen(req)
          print('Slack 알림 전송 완료')
          PYEOF
